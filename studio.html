<!DOCTYPE html>
<html lang="zh-CN" data-accent="blue">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>写文章 · BlueStar5468</title>
<meta name="description" content="本地写作工具：用组件拼文章，导出 json 放进 blog/。" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232563eb'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58' fill='white' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E" />

<meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-section="studio">

<!-- 顶栏（这页不用 render.js，静态写死） -->
<header class="topbar">
  <div class="topbar__inner">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__logo" aria-hidden="true">B</span>
      <span>BlueStar</span>
      <small>写文章</small>
    </a>
    <nav class="topbar__nav" aria-label="站点导航">
      <a class="topbar__link" href="blog.html">← 回博客</a>
      <a class="topbar__link" href="test.html">实验室</a>
    </nav>
  </div>
</header>

<div class="bg" aria-hidden="true">
  <span class="bg__blob bg__blob--blue"></span>
  <span class="bg__blob bg__blob--cyan"></span>
  <span class="bg__blob bg__blob--amber"></span>
  <span class="bg__grid"></span>
</div>

<main class="studio">

  <!-- 顶部工具条 -->
  <div class="studio__bar">
    <input class="studio__id" id="postId" placeholder="文件名 / id（英文，比如 stm32-notes）" />
    <span class="studio__spacer"></span>
    <button class="btn" type="button" id="btnImport">导入 JSON</button>
    <button class="btn" type="button" id="btnClear">清空</button>
    <button class="btn" type="button" id="btnCopy">复制 JSON</button>
    <button class="btn btn--primary" type="button" id="btnDownload">下载 json</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden />
  </div>

  <div class="studio__grid" id="studioGrid">

    <!-- ══════════ 左：文章信息 + 内容块（可整体收起 / 分区折叠） ══════════ -->
    <section class="studio__left" id="leftCol">

      <div class="studio__leftHead">
        <button class="studio__collapse" id="btnCollapse" type="button"
                title="收起 / 展开左侧" aria-controls="leftBody" aria-expanded="true">«</button>
        <span class="studio__leftTitle">编辑面板</span>
      </div>

      <div class="studio__leftBody" id="leftBody">

        <!-- 分区 1：文章信息 -->
        <div class="card studio__sec" data-sec="info">
          <button class="studio__secHead" type="button" aria-expanded="true">
            <span class="studio__secTitle">文章信息</span>
            <span class="studio__chev" aria-hidden="true">▾</span>
          </button>
          <div class="studio__secBody">
            <label class="fld"><span class="fld__cap">标题</span><input id="mTitle" type="text" placeholder="文章标题" /></label>
            <label class="fld"><span class="fld__cap">日期</span><input id="mDate" type="date" /></label>
            <label class="fld"><span class="fld__cap">摘要</span><textarea id="mSummary" rows="2" placeholder="一句话，列表里会显示"></textarea></label>
            <label class="fld"><span class="fld__cap">标签（逗号分隔）</span><input id="mTags" type="text" placeholder="嵌入式, 笔记" /></label>
            <label class="fld"><span class="fld__cap">封面图（可选）</span><input id="mCover" type="text" list="assets" placeholder="assets/xxx.jpg" /></label>
          </div>
        </div>

        <!-- 分区 2：内容块 -->
        <div class="card studio__sec" data-sec="blocks">
          <button class="studio__secHead" type="button" aria-expanded="true">
            <span class="studio__secTitle">内容块</span>
            <span class="studio__chev" aria-hidden="true">▾</span>
          </button>
          <div class="studio__secBody">
            <div class="studio__blocks" id="blockList"></div>
            <div class="studio__add">
              <select id="addType" aria-label="要添加的组件类型"></select>
              <button class="btn" type="button" id="btnAdd">+ 添加</button>
            </div>
          </div>
        </div>

      </div>

      <!-- 收起后只剩这条窄边 -->
      <div class="studio__rail" id="leftRail">
        <button class="studio__railBtn" type="button" data-rail="expand" title="展开左侧">»</button>
        <button class="studio__railBtn" type="button" data-rail="info" title="文章信息">📄</button>
        <button class="studio__railBtn" type="button" data-rail="blocks" title="内容块">📋</button>
      </div>

    </section>

    <!-- ══════════ 中：表单（左栏收起后这里会变宽） ══════════ -->
    <section class="studio__mid">
      <div class="card pad" id="formHost">
        <p class="pd-load">左边选一个块…</p>
      </div>
    </section>

    <!-- ══════════ 右：预览（容器可拖动改宽高） ══════════ -->
    <section class="studio__right">
      <div class="studio__pvBar">
        <span class="studio__pvTitle">预览</span>
        <span class="studio__pvBtns">
          <button class="studio__pvBtn is-on" type="button" data-w="0" title="跟容器一样宽">自适应</button>
          <button class="studio__pvBtn" type="button" data-w="1280">桌面</button>
          <button class="studio__pvBtn" type="button" data-w="820">平板</button>
          <button class="studio__pvBtn" type="button" data-w="390">手机</button>
        </span>
        <span class="studio__pvSize" id="pvSize">—</span>
      </div>
      <div class="studio__frame" id="frameBox" title="右下角可以拖动改大小">
        <iframe class="studio__iframe" id="pvFrame" title="预览"></iframe>
      </div>
      <p class="studio__pvHint">拖动右下角可以自由改宽高 —— 里面的媒体查询会真的响应，能看出手机/平板下的效果。</p>
    </section>

  </div>

  <!-- 导出 -->
  <div class="card pad">
    <h3 class="mini-title">导出</h3>
    <p class="debug-note" id="hint"></p>
    <pre class="studio__json" id="jsonOut"></pre>
  </div>

</main>

<datalist id="assets">
  <option value="assets/avatar.jpg"></option>
  <option value="assets/board.jpg"></option>
  <option value="assets/layout.jpg"></option>
  <option value="assets/hex-c.png"></option>
  <option value="assets/hex-cpp.png"></option>
  <option value="assets/hex-csharp.png"></option>
  <option value="assets/logo-opengl.png"></option>
  <option value="assets/logo-linux.png"></option>
</datalist>

<!-- 只需要组件库；这页不引 main.js / projects.js / blog.js -->
<script src="js/blocks.js"></script>
<script src="js/studio.js"></script>
</body>
</html>
