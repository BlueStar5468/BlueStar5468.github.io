<body data-section="blog">

<!-- ════════════ 顶部导航栏 ════════════ -->
<header class="topbar">

    <a class="topbar__brand" href="index.html">

<!-- 背景装饰 -->

  <span class="bg__blob bg__blob--blue"></span>
  <span class="bg__blob bg__blob--cyan"></span>
  <span class="bg__blob bg__blob--amber"></span>
  <span class="bg__grid"></span>
</div>

<div class="blog-shell">

  <aside class="bside" aria-label="个人介绍">
    <div class="card bside__card">

      <div class="bside__head">
        <div class="avatar avatar--flat" data-cfg="side.avatar" data-avatar>
          <span class="avatar__letter" data-fill="side.avatar">YN</span>
        </div>
        <div class="bside__id">
          <h1 class="bside__name" data-cfg="side.name" data-fill="side.name">BlueStar</h1>

      <ul class="bside__meta" data-cfg="side.meta" data-list="side.meta" data-item="meta">
        <li>泛星际蓝星工作室</li>
      </ul>

      <nav class="bside__links" data-cfg="side.links" data-list="side.links" data-item="link">
        <a class="link" href="https://github.com/BlueStar5468" target="_blank" rel="noopener">
          <span class="link__ico">GH</span>
          <span class="link__text">GitHub</span>
          <span class="link__arrow">↗</span>
        </a>
      </nav>

    </div>
    <!-- 介绍卡下面：由 blog/_home.json 的 sidebar 生成（默认放「最近文章」） -->
    <div class="bside__extra" id="bsideExtra"></div>
  </aside>

  <!-- 文章内容：头部用 meta 生成，正文用 page.blocks -->
  <main class="bmain bmain--post">
    <a class="postback" href="blog.html">← 回到博客</a>
    <article class="ppost" id="ppost">
      <p class="pd-load">正在加载…</p>
    </article>
  </main>

</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
