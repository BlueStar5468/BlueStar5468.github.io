<!DOCTYPE html>
<html lang="zh-CN" data-accent="blue">

<link rel="stylesheet" href="css/style.css" />

<body data-section="projects" data-booting>
  <noscript><p class="noscript">这个页面的内容由 JavaScript 渲染，开启后会显示。</p></noscript>

<!-- ════════════ 顶部导航栏（所有页面共用，链接在 js/content.js 的 site.nav）════════════ -->
<header class="topbar">
  <div class="topbar__inner">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__logo" aria-hidden="true">B</span>
      <span data-fill="side.name"></span>
      <small>BSuniStudio</small>
    </a>
    <nav class="topbar__nav" aria-label="站点导航" data-list="site.nav" data-item="navlink">
      <a class="topbar__link" href="index.html">主页</a>
      <a class="topbar__link is-active" href="projects.html">项目</a>
    </nav>
  </div>
</header>

<!-- 背景装饰 -->

  <span class="bg__blob bg__blob--blue"></span>
  <span class="bg__blob bg__blob--cyan"></span>
  <span class="bg__blob bg__blob--amber"></span>
  <span class="bg__grid"></span>
</div>

<!-- ════════════ 项目页外壳：左边导航（可收起） + 右边内容 ════════════ -->
<main class="page-shell boot-hide">

  <!-- 项目导航：内容由 js/projects.js 按 projects/_index.json 生成 -->

    <p class="landing__foot" data-fill-html="side.credit"></p>

  </div>
</main>

<!-- 这页没有滚动翻页，不需要 main.js -->
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/render.js"></script>
<script src="js/projects.js"></script>
